<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AAMS - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#e5ecff",
                        "on-error": "#ffffff",
                        "secondary-container": "#dce2f9",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#dce2f9",
                        "on-secondary-container": "#151b2c",
                        "on-surface-variant": "#44474f",
                        "inverse-surface": "#2f3033",
                        "on-surface": "#1a1b1f",
                        "on-primary-fixed": "#001849",
                        "primary": "#0052cc",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#003b9b",
                        "secondary-fixed-dim": "#bfc6dc",
                        "background": "#fdfcff",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#b0c6ff",
                        "inverse-on-surface": "#f1f0f4",
                        "surface-container-high": "#e0e7fc",
                        "tertiary-container": "#fdd8ff",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#151b2c",
                        "tertiary": "#814292",
                        "secondary": "#575e71",
                        "on-tertiary-fixed-variant": "#672979",
                        "surface-variant": "#e1e2ec",
                        "surface-tint": "#0052cc",
                        "surface-bright": "#f8f9ff",

                        "surface-container-low": "#eff4ff",
                        "on-primary-container": "#001849",
                        "on-background": "#1a1b1f",
                        "on-error-container": "#410002",
                        "tertiary-fixed": "#fdd8ff",
                        "surface": "#f8f9ff",
                        "on-tertiary-fixed": "#330043",
                        "tertiary-fixed-dim": "#f0b2ff",
                        "primary-container": "#d9e2ff",
                        "outline": "#74777f",
                        "on-secondary-fixed-variant": "#3f4759",
                        "inverse-primary": "#b0c6ff",
                        "surface-dim": "#cbdbf5",
                        "primary-fixed": "#d9e2ff",
                        "on-tertiary-container": "#330043",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#c4c6d0"
                    },
                    "borderRadius": {

                    },
                    "fontFamily": {

<style>
        .input-glow:focus {
            box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.2);
            border-color: #0052cc;
        }
        
        /* Custom scrollbar for dropdowns */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c4c6d0;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #74777f;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface-dim text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden font-body-md antialiased selection:bg-primary selection:text-on-primary">
<!-- Main Container -->
<main class="w-full max-w-md mx-auto z-10 p-container-padding">
<!-- Header -->
<div class="text-center mb-stack-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm font-bold">AAMS</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Create your institutional account.</p>
</div>
<!-- Signup Card -->
<div class="bg-surface-container-lowest rounded-xl p-stack-md shadow-sm border border-outline-variant/50 relative">
<!-- Segmented Control (Role Selector) -->
<div class="flex p-1 bg-surface-container-low rounded-lg mb-stack-md relative" role="tablist">
<!-- Active Indicator Background -->
<div class="absolute top-1 bottom-1 left-1 bg-primary rounded-md shadow-sm transition-all duration-300 ease-out z-0 w-[calc(33.333%-2px)]" id="roleIndicator"></div>
<button aria-selected="true" class="role-btn relative z-10 flex-1 py-2 text-center font-label-md text-label-md uppercase text-on-primary transition-colors duration-200" data-role="student" role="tab" type="button">
                    Student
                </button>
<button aria-selected="false" class="role-btn relative z-10 flex-1 py-2 text-center font-label-md text-label-md uppercase text-on-surface-variant hover:text-on-surface transition-colors duration-200" data-role="faculty" role="tab" type="button">
                    Faculty
                </button>
<button aria-selected="false" class="role-btn relative z-10 flex-1 py-2 text-center font-label-md text-label-md uppercase text-on-surface-variant hover:text-on-surface transition-colors duration-200" data-role="admin" role="tab" type="button">
                    Admin
                </button>
</div>
<form class="space-y-stack-md flex flex-col" id="signupForm">
<!-- Invite Code Field (Hidden by default, shown for Faculty/Admin) -->
<div class="hidden opacity-0 transition-opacity duration-300 transform -translate-y-2" id="inviteCodeContainer">
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit uppercase tracking-wider" for="inviteCode">Invite Code</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">vpn_key</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-0 input-glow transition-all placeholder-on-surface-variant/50" id="inviteCode" placeholder="Required for staff" type="text"/>
</div>
</div>
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit uppercase tracking-wider" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-0 input-glow transition-all placeholder-on-surface-variant/50" id="fullName" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- Roll Number / ID -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit uppercase tracking-wider" for="rollNumber" id="rollNumberLabel">Roll Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">badge</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-0 input-glow transition-all placeholder-on-surface-variant/50" id="rollNumber" placeholder="e.g. CS2024-001" required="" type="text"/>
</div>
</div>
<!-- Department Dropdown -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit uppercase tracking-wider" for="department">Department</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] z-10 pointer-events-none">domain</span>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-10 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-0 input-glow transition-all appearance-none cursor-pointer" id="department" required="">
<option class="text-on-surface-variant/50" disabled="" selected="" value="">Select Department</option>
<option value="cs">Computer Science</option>
<option value="eng">Engineering</option>
<option value="arts">Arts &amp; Humanities</option>
<option value="sci">Applied Sciences</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline text-[20px] pointer-events-none">expand_more</span>
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit uppercase tracking-wider" for="email">Institutional Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-0 input-glow transition-all placeholder-on-surface-variant/50" id="email" placeholder="name@institution.edu" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-10 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-0 input-glow transition-all placeholder-on-surface-variant/50" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-unit uppercase tracking-wider" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock_reset</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-10 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-0 input-glow transition-all placeholder-on-surface-variant/50" id="confirmPassword" placeholder="••••••••" required="" type="password"/>
<!-- Match Indicator -->
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-primary text-[20px] opacity-0 transition-opacity duration-200" id="passwordMatchIcon">check_circle</span>
</div>
</div>
<!-- Action Button -->
<button class="w-full mt-stack-md py-3 rounded-lg bg-primary text-on-primary font-label-md text-label-md uppercase tracking-wider font-bold transition-all hover:bg-on-primary-fixed-variant hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] shadow-sm" type="submit">
                    Create Account
                </button>
</form>
<div class="mt-stack-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? <a class="text-primary hover:text-on-primary-fixed-variant transition-colors underline decoration-primary/30 underline-offset-4 font-semibold" href="#">Sign in</a>
</p>
</div>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const roleBtns = document.querySelectorAll('.role-btn');
            const indicator = document.getElementById('roleIndicator');
            const inviteCodeContainer = document.getElementById('inviteCodeContainer');
            const inviteCodeInput = document.getElementById('inviteCode');
            const rollNumberLabel = document.getElementById('rollNumberLabel');
            
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            const matchIcon = document.getElementById('passwordMatchIcon');

            // Role Selector Logic
            roleBtns.forEach((btn, index) => {
                btn.addEventListener('click', () => {
                    // Update indicator position
                    indicator.style.transform = `translateX(${index * 100}%)`;
                    
                    // Update aria and styles
                    roleBtns.forEach(b => {
                        b.setAttribute('aria-selected', 'false');
                        b.classList.remove('text-on-primary');
                        b.classList.add('text-on-surface-variant');
                    });
                    
                    btn.setAttribute('aria-selected', 'true');
                    btn.classList.add('text-on-primary');
                    btn.classList.remove('text-on-surface-variant');

                    // Handle Form Changes based on role
                    const role = btn.dataset.role;
                    if (role === 'faculty' || role === 'admin') {
                        inviteCodeContainer.classList.remove('hidden');
                        // Small delay to allow display:block to apply before animating opacity/transform
                        setTimeout(() => {
                            inviteCodeContainer.classList.remove('opacity-0', '-translate-y-2');
                        }, 10);
                        inviteCodeInput.setAttribute('required', 'true');
                        rollNumberLabel.textContent = 'Staff ID';
                    } else {
                        inviteCodeContainer.classList.add('opacity-0', '-translate-y-2');
                        setTimeout(() => {
                            inviteCodeContainer.classList.add('hidden');
                        }, 300); // Wait for transition
                        inviteCodeInput.removeAttribute('required');
                        rollNumberLabel.textContent = 'Roll Number';
                    }
                });
            });

            // Password Match Logic
            const checkPasswordMatch = () => {
                if (confirmPassword.value.length > 0) {
                    if (password.value === confirmPassword.value) {
                        matchIcon.classList.remove('opacity-0');
                        confirmPassword.style.borderColor = '#0052cc'; // primary for success
                    } else {
                        matchIcon.classList.add('opacity-0');
                        confirmPassword.style.borderColor = '#ba1a1a'; // error color
                    }
                } else {
                    matchIcon.classList.add('opacity-0');
                    confirmPassword.style.borderColor = ''; // reset
                }
            };

            password.addEventListener('input', checkPasswordMatch);
            confirmPassword.addEventListener('input', checkPasswordMatch);
        });
    </script>
</body></html>
