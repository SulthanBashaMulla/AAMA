<body class="bg-[#F8FAFC] text-[#1E293B] min-h-screen flex items-center justify-center p-layout-margin-mobile md:p-layout-margin-desktop font-body-md relative overflow-hidden">
<!-- Decorative background elements -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-blue-100 opacity-50 blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-100 opacity-50 blur-[100px] pointer-events-none"></div>
<main class="w-full max-w-md relative z-10">
<div class="bg-white rounded-xl p-lg md:p-xl shadow-lg border border-slate-200 flex flex-col gap-lg">
<!-- Header -->
<div class="text-center flex flex-col gap-sm">
<h1 class="font-display-lg text-display-lg text-[#1E40AF] tracking-tight">AAMS</h1>
<p class="font-body-md text-body-md text-[#1E293B]">Sign in to your account</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-md" method="POST">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-[#1E293B]" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">mail</span>
<input class="w-full bg-white border border-slate-300 rounded-lg py-3 pl-10 pr-4 text-[#1E293B] focus:outline-none focus:border-[#1E40AF] focus:ring-1 focus:ring-[#1E40AF] transition-colors font-body-md text-body-md" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-[#1E293B]" for="password">Password</label>
<a class="font-label-md text-label-md text-[#1E40AF] hover:underline transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
<input class="w-full bg-white border border-slate-300 rounded-lg py-3 pl-10 pr-4 text-[#1E293B] focus:outline-none focus:border-[#1E40AF] focus:ring-1 focus:ring-[#1E40AF] transition-colors font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="pt-sm">
<button class="w-full bg-[#1E40AF] text-white font-title-md text-body-lg py-3 rounded-lg hover:bg-blue-900 transition-all active:scale-[0.98] flex items-center justify-center gap-2 h-[44px]" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer -->
<div class="text-center pt-md border-t border-slate-200">
<p class="font-body-md text-body-md text-[#1E293B]">
                    Don't have an account? 
                    <a class="text-[#1E40AF] hover:underline transition-colors font-title-md ml-1" href="#">Sign up</a>
</p>
</div>
</div>
</main>
</body></html>
