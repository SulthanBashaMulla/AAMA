<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AAMS Login</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#f1f4fb",
                        "on-error": "#ffffff",
                        "secondary-container": "#dae2f9",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#dae2f9",
                        "on-secondary-container": "#131c2b",
                        "on-surface-variant": "#44474e",
                        "inverse-surface": "#2e3036",
                        "on-surface": "#191c20",
                        "on-primary-fixed": "#001849",
                        "primary": "#0052cc",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#003b9b",
                        "secondary-fixed-dim": "#bec6dc",
                        "background": "#f8f9ff",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#b0c6ff",
                        "inverse-on-surface": "#eff0f7",
                        "surface-container-high": "#e5e8ef",
                        "tertiary-container": "#ffdbd0",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#131c2b",
                        "tertiary": "#8f4c38",
                        "secondary": "#565e71",
                        "on-tertiary-fixed-variant": "#723523",
                        "surface-variant": "#e0e2ec",
                        "surface-tint": "#0052cc",
                        "surface-bright": "#f8f9ff",
                        "surface-container-highest": "#dfe2e9",
                        "surface-container-low": "#eff4ff",
                        "on-primary-container": "#001849",
                        "on-background": "#191c20",
                        "on-error-container": "#410002",
                        "tertiary-fixed": "#ffdbd0",
                        "surface": "#f8f9ff",
                        "on-tertiary-fixed": "#3a0b01",
                        "tertiary-fixed-dim": "#ffb5a0",
                        "primary-container": "#d9e2ff",
                        "outline": "#74777f",
                        "on-secondary-fixed-variant": "#3f4759",
                        "inverse-primary": "#b0c6ff",
                        "surface-dim": "#cbdbf5",
                        "primary-fixed": "#d9e2ff",
                        "on-tertiary-container": "#3a0b01",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#c4c6d0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "24px",
                        "unit": "8px",
                        "container-padding": "32px",
                        "stack-sm": "12px",
                        "stack-lg": "48px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"],
                        "label-md": ["Inter", "sans-serif"],
                        "display-lg": ["Inter", "sans-serif"],
                        "body-sm": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .input-glow:focus-within {
            box-shadow: 0 0 0 2px #0052cc;
            border-color: #0052cc;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md">
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-md px-container-padding py-stack-lg">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-lg border border-outline-variant/30 flex flex-col gap-stack-md">
<!-- Header -->
<div class="text-center mb-4">
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter mb-2">AAMS</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your session.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-sm">
<!-- Email Input -->
<div class="relative group input-glow rounded-lg border border-outline-variant bg-surface-container-lowest transition-all duration-300">
<input class="peer w-full bg-transparent border-none text-on-surface font-body-md px-4 pt-6 pb-2 focus:ring-0 outline-none" id="email" placeholder=" " required="" type="email"/>
<label class="absolute left-4 top-4 text-on-surface-variant font-body-sm transition-all duration-200 peer-focus:top-2 peer-focus:text-[10px] peer-focus:text-primary peer-valid:top-2 peer-valid:text-[10px] peer-valid:text-on-surface-variant cursor-text pointer-events-none uppercase tracking-wider" for="email">Email Address</label>
</div>
<!-- Password Input -->
<div class="relative group input-glow rounded-lg border border-outline-variant bg-surface-container-lowest transition-all duration-300">
<input class="peer w-full bg-transparent border-none text-on-surface font-body-md px-4 pt-6 pb-2 focus:ring-0 outline-none" id="password" placeholder=" " required="" type="password"/>
<label class="absolute left-4 top-4 text-on-surface-variant font-body-sm transition-all duration-200 peer-focus:top-2 peer-focus:text-[10px] peer-focus:text-primary peer-valid:top-2 peer-valid:text-[10px] peer-valid:text-on-surface-variant cursor-text pointer-events-none uppercase tracking-wider" for="password">Password</label>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
<!-- Actions row -->
<div class="flex justify-between items-center mt-2 mb-4">
<label class="flex items-center gap-2 cursor-pointer">
<input class="rounded border-outline-variant bg-surface-container-lowest text-primary focus:ring-primary focus:ring-offset-background" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">Remember me</span>
</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-fixed-variant transition-colors" href="#">Forgot password?</a>
</div>
<!-- CTA -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md uppercase rounded-lg py-4 hover:bg-primary-fixed-variant transition-all duration-300 inset-0 active:scale-[0.98]" type="submit">
                    Sign In
                </button>
</form>
<!-- Footer Links -->
<div class="mt-4 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? <a class="text-primary hover:text-primary-fixed-variant font-bold transition-colors" href="#">Sign up</a>
</p>
</div>
</div>
</main>
</body></html>
